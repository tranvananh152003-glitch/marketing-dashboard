<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .log {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            word-wrap: break-word;
        }
        .error {
            border-left-color: #ef4444;
            background: #fee;
        }
        .success {
            border-left-color: #10b981;
            background: #efe;
        }
        h1 { color: #333; }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .btn:active {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <h1>🐛 Debug Dashboard</h1>
    <div id="logs"></div>
    
    <button class="btn" onclick="testSupabase()">Test Supabase</button>
    <button class="btn" onclick="loadDashboard()">Mở Dashboard</button>
    <button class="btn" onclick="clearLogs()">Xóa Logs</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const logsDiv = document.getElementById('logs');
        
        function addLog(message, type = 'log') {
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong><br>${message}`;
            logsDiv.insertBefore(div, logsDiv.firstChild);
        }
        
        function clearLogs() {
            logsDiv.innerHTML = '';
        }
        
        // Capture console
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            addLog(args.join(' '), 'log');
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            addLog('❌ ' + args.join(' '), 'error');
            originalError.apply(console, args);
        };
        
        // Check initial
        addLog('Bắt đầu kiểm tra...', 'log');
        
        if (typeof window.supabase === 'undefined') {
            addLog('❌ Supabase library KHÔNG được tải!', 'error');
        } else {
            addLog('✅ Supabase library đã tải', 'success');
        }
        
        // Load config
        const SUPABASE_URL = 'https://mtzkanuzjeaoejahwmmm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10emthbnV6amVhb2VqYWh3bW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwOTM1NjcsImV4cCI6MjEwMjY2OTU2N30.Darv0i4Tfabeqit_OERNxISrf9W-eqCYKABaFFitBBw';
        
        let supabase;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            addLog('✅ Supabase client khởi tạo thành công', 'success');
            addLog('📍 URL: ' + SUPABASE_URL, 'log');
        } catch (error) {
            addLog('❌ Lỗi khởi tạo: ' + error.message, 'error');
        }
        
        async function testSupabase() {
            addLog('⏳ Đang test kết nối...', 'log');
            
            try {
                const { data, error } = await supabase
                    .from('tasks')
                    .select('*');
                
                if (error) throw error;
                
                addLog(`✅ Kết nối thành công! Tìm thấy ${data.length} công việc`, 'success');
                addLog('Dữ liệu: ' + JSON.stringify(data, null, 2), 'log');
                
            } catch (error) {
                addLog('❌ Lỗi: ' + error.message, 'error');
                addLog('Chi tiết: ' + JSON.stringify(error), 'error');
            }
        }
        
        function loadDashboard() {
            window.location.href = 'dashboard-supabase.html';
        }
        
        // Auto test sau 1 giây
        setTimeout(() => {
            testSupabase();
        }, 1000);
    </script>
</body>
</html>
