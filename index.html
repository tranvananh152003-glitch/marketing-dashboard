<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Dashboard 2026</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px}
.container{background:white;padding:50px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;max-width:600px}
h1{color:#333;font-size:32px;margin-bottom:20px}
.status{background:#10b981;color:white;padding:20px;border-radius:12px;margin:25px 0;font-size:20px;font-weight:bold}
.btn{display:inline-block;background:#667eea;color:white;padding:20px 50px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold;margin:30px 0;transition:all 0.3s;box-shadow:0 5px 20px rgba(102,126,234,0.4)}
.btn:hover{background:#5568d3;transform:translateY(-5px);box-shadow:0 8px 30px rgba(102,126,234,0.6)}
p{color:#666;line-height:1.8;margin:15px 0;font-size:16px}
.info{background:#f8f9fa;padding:25px;border-radius:10px;margin-top:30px}
.info ul{list-style:none;padding:0;text-align:left}
.info li{padding:10px 0;color:#555;font-size:15px}
.info li:before{content:"✓ ";color:#10b981;font-weight:bold;margin-right:10px}
</style>
</head>
<body>
<div class="container">
<h1>📊 Marketing Dashboard 2026</h1>
<div class="status">✅ Website đang hoạt động!</div>
<p>Chào mừng đến với bảng theo dõi tiến độ Marketing</p>
<a href="dashboard.html" class="btn">🚀 MỞ DASHBOARD</a>
<div class="info">
<ul>
<li>Thêm, sửa, xóa công việc trực tiếp</li>
<li>Theo dõi tiến độ realtime</li>
<li>Lọc theo trạng thái</li>
<li>Xuất/nhập dữ liệu JSON</li>
<li>Xem tốt trên điện thoại</li>
</ul>
</div>
<p style="margin-top:25px;font-size:14px;color:#999">Cập nhật: <span id="time"></span></p>
</div>
<script>document.getElementById('time').textContent=new Date().toLocaleString('vi-VN');</script>
</body>
</html>
