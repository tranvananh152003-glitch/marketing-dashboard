<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Marketing 2026 - Supabase</title>
    <link rel="stylesheet" href="dashboard-supabase.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Bảng Theo Dõi Marketing 2026</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="app.openAddModal()">➕ Thêm công việc</button>
                <button class="btn btn-primary" onclick="app.exportData()">💾 Xuất dữ liệu</button>
                <button class="btn btn-primary" onclick="app.importExcel()">📊 Nhập Excel</button>
            </div>
            <div style="margin-top:15px;color:#666;font-size:14px;">
                Cập nhật: <span id="lastUpdate">-</span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card completed" id="completedCard" onclick="app.filterByStatus('completed')" style="cursor:pointer;">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="completedTasks">-</div>
                <div class="stat-label">Hoàn thành</div>
            </div>
            <div class="stat-card progress" id="inprogressCard" onclick="app.filterByStatus('inprogress')" style="cursor:pointer;">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="inProgressTasks">-</div>
                <div class="stat-label">Đang thực hiện</div>
            </div>
            <div class="stat-card pending" id="pendingCard" onclick="app.filterByStatus('pending')" style="cursor:pointer;">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="pendingTasks">-</div>
                <div class="stat-label">Chưa bắt đầu</div>
            </div>
            <div class="stat-card overdue" id="overdueCard" onclick="app.filterByStatus('overdue')" style="cursor:pointer;">
                <div class="stat-icon">⚠️</div>
                <div class="stat-value" id="overdueTasks">-</div>
                <div class="stat-label">Quá hạn</div>
            </div>
        </div>

        <div class="view-tabs">
            <button class="view-tab active" onclick="app.switchView('all')">📋 Tất cả</button>
            <button class="view-tab" onclick="app.switchView('group')">📁 Theo nhóm việc</button>
            <button class="view-tab" onclick="app.switchView('people')">👥 Theo người</button>
        </div>

        <div id="groupTabs" class="group-tabs" style="display:none;"></div>
        <div id="personTabs" class="person-tabs" style="display:none;"></div>

        <div class="tasks-container" id="tasksContainer">
            <div style="text-align:center;padding:40px;color:#667eea;background:white;border-radius:15px;">
                <div style="font-size:48px;margin-bottom:20px;">⏳</div>
                <div style="font-size:18px;font-weight:600;">Đang tải dữ liệu...</div>
            </div>
        </div>
    </div>

    <!-- Modal Xem chi tiết -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">👁️ Chi tiết công việc</div>
            <div id="viewModalContent"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-primary" onclick="app.closeViewModal()">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Modal Nộp bài -->
    <div class="modal" id="submitModal">
        <div class="modal-content">
            <div class="modal-header" id="submitModalTitle">📤 Nộp bài</div>
            <form id="submitForm">
                <div class="form-group">
                    <label>Link nộp bài</label>
                    <input type="url" name="submissionLink" placeholder="https://...">
                </div>
                
                <div id="existingFiles" style="display:none;margin-bottom:15px;"></div>
                
                <div class="form-group">
                    <label>📎 Đính kèm file</label>
                    <div class="file-upload-area">
                        <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xlsx,.xls,.zip,.rar" style="display:none;" onchange="app.handleFileSelect(event)" multiple>
                        <button type="button" class="file-select-btn" onclick="document.getElementById('fileInput').click()">
                            📁 Chọn file
                        </button>
                        <small style="color:#666;font-size:12px;display:block;margin-top:5px;">Ảnh, PDF, Word, Excel, ZIP</small>
                    </div>
                    <div id="selectedFiles" class="selected-files"></div>
                </div>
                
                <div class="form-group">
                    <label>Ghi chú</label>
                    <input type="text" name="submissionNote" placeholder="VD: File đã gửi email">
                </div>
                
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:10px;">
                        <input type="checkbox" id="markCompleteCheck" style="width:20px;height:20px;">
                        <span>Đánh dấu hoàn thành</span>
                    </label>
                </div>
                
                <input type="hidden" name="taskId">
                
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="app.closeSubmitModal()" style="background:#6b7280;color:white;">Hủy</button>
                    <button type="submit" class="btn btn-success">Nộp</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Thêm/Sửa -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Thêm công việc mới</div>
            <form id="taskForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nhóm việc *</label>
                        <input type="text" name="group" required placeholder="VD: Marketing Online">
                    </div>
                    <div class="form-group">
                        <label>Chương trình *</label>
                        <input type="text" name="program" required placeholder="VD: Social Media">
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label>Công việc *</label>
                    <input type="text" name="title" required placeholder="VD: Đăng bài Facebook">
                </div>
                
                <div class="form-group full-width">
                    <label>Mô tả</label>
                    <textarea name="description" placeholder="Mô tả chi tiết..."></textarea>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Người điều phối *</label>
                        <input type="text" name="coordinator" required>
                    </div>
                    <div class="form-group">
                        <label>Người thực hiện *</label>
                        <input type="text" name="assignee" required>
                    </div>
                    <div class="form-group">
                        <label>Người duyệt *</label>
                        <input type="text" name="approver" required>
                    </div>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Deadline *</label>
                        <input type="date" name="deadline" required>
                    </div>
                    <div class="form-group">
                        <label>Tần suất *</label>
                        <select name="frequency" required>
                            <option value="Một lần">Một lần</option>
                            <option value="Hàng ngày">Hàng ngày</option>
                            <option value="Hàng tuần">Hàng tuần</option>
                            <option value="Hàng tháng">Hàng tháng</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Trạng thái *</label>
                        <select name="status" required>
                            <option value="pending">Chưa bắt đầu</option>
                            <option value="inprogress">Đang thực hiện</option>
                            <option value="completed">Hoàn thành</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label>Đầu ra bắt buộc *</label>
                    <input type="text" name="requiredOutput" required placeholder="VD: 1 bài post + 3 ảnh">
                </div>
                
                <div class="form-group">
                    <label>Tiến độ (%) *</label>
                    <input type="number" name="progress" min="0" max="100" value="0" required>
                </div>
                
                <input type="hidden" name="id">
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="app.closeModal()" style="background:#6b7280;color:white;">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
