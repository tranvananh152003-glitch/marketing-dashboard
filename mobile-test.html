<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Test - Marketing Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            font-weight: 600;
        }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
        .loading { background: #fef3c7; color: #92400e; }
        .info { background: #dbeafe; color: #1e40af; }
        
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }
        button:active {
            background: #5568d3;
            transform: scale(0.98);
        }
        
        .task-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }
        .task-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .task-meta {
            font-size: 12px;
            color: #666;
        }
        
        pre {
            background: #1f2937;
            color: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .count {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Kết Nối Supabase</h1>
    
    <div class="box">
        <h2>1️⃣ Trạng thái thư viện</h2>
        <div id="libraryStatus" class="status loading">⏳ Đang kiểm tra...</div>
    </div>
    
    <div class="box">
        <h2>2️⃣ Kết nối Supabase</h2>
        <div id="connectionStatus" class="status loading">⏳ Đang kiểm tra...</div>
    </div>
    
    <div class="box">
        <h2>3️⃣ Số lượng công việc</h2>
        <div id="taskCount" class="count">-</div>
        <button onclick="loadTasks()">🔄 Tải lại dữ liệu</button>
    </div>
    
    <div class="box">
        <h2>4️⃣ Danh sách công việc</h2>
        <div id="taskList"></div>
    </div>
    
    <div class="box">
        <h2>5️⃣ Chi tiết lỗi (nếu có)</h2>
        <pre id="errorLog">Không có lỗi</pre>
    </div>
    
    <button onclick="window.location.href='dashboard-supabase.html'">
        ➡️ Mở Dashboard Chính
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const errorLog = [];
        
        function log(message, isError = false) {
            const timestamp = new Date().toLocaleTimeString();
            errorLog.push(`[${timestamp}] ${isError ? '❌' : '✅'} ${message}`);
            document.getElementById('errorLog').textContent = errorLog.join('\n');
            console.log(message);
        }
        
        // Step 1: Check Supabase library
        const libStatus = document.getElementById('libraryStatus');
        if (typeof window.supabase === 'undefined') {
            libStatus.className = 'status error';
            libStatus.textContent = '❌ Thư viện Supabase KHÔNG được tải!';
            log('Supabase library not loaded', true);
        } else {
            libStatus.className = 'status success';
            libStatus.textContent = '✅ Thư viện Supabase đã tải thành công';
            log('Supabase library loaded');
        }
        
        // Step 2: Initialize Supabase
        const SUPABASE_URL = 'https://mtzkanuzjeaoejahwmmm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10emthbnV6amVhb2VqYWh3bW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwOTM1NjcsImV4cCI6MjEwMjY2OTU2N30.Darv0i4Tfabeqit_OERNxISrf9W-eqCYKABaFFitBBw';
        
        let supabase;
        const connStatus = document.getElementById('connectionStatus');
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            connStatus.className = 'status success';
            connStatus.textContent = '✅ Supabase client đã khởi tạo';
            log('Supabase client initialized');
            log('URL: ' + SUPABASE_URL);
        } catch (error) {
            connStatus.className = 'status error';
            connStatus.textContent = '❌ Lỗi khởi tạo: ' + error.message;
            log('Init error: ' + error.message, true);
        }
        
        // Step 3: Load tasks
        async function loadTasks() {
            const countEl = document.getElementById('taskCount');
            const listEl = document.getElementById('taskList');
            
            countEl.textContent = '⏳';
            listEl.innerHTML = '<div class="status loading">⏳ Đang tải dữ liệu...</div>';
            
            try {
                log('Fetching tasks from Supabase...');
                
                const { data, error } = await supabase
                    .from('tasks')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    log('Query error: ' + error.message, true);
                    log('Error details: ' + JSON.stringify(error), true);
                    throw error;
                }
                
                log(`Successfully fetched ${data.length} tasks`);
                
                // Show count
                countEl.textContent = data.length;
                
                // Show list
                if (data.length === 0) {
                    listEl.innerHTML = '<div class="status info">ℹ️ Chưa có công việc nào trong database</div>';
                } else {
                    listEl.innerHTML = data.map(task => `
                        <div class="task-item">
                            <div class="task-title">${task.title}</div>
                            <div class="task-meta">
                                👤 ${task.assignee || 'N/A'} | 
                                📅 ${task.deadline || 'N/A'} | 
                                📊 ${task.status || 'N/A'}
                            </div>
                        </div>
                    `).join('');
                }
                
                // Log first task as sample
                if (data.length > 0) {
                    log('Sample task: ' + JSON.stringify(data[0], null, 2));
                }
                
            } catch (error) {
                countEl.textContent = '❌';
                listEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}</div>`;
                log('Load tasks failed: ' + error.message, true);
                
                // Check if it's a CORS or network error
                if (error.message.includes('fetch')) {
                    log('Có thể lỗi mạng hoặc CORS', true);
                }
            }
        }
        
        // Auto load on page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                loadTasks();
            }, 1000);
        });
    </script>
</body>
</html>
