<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Marketing 2026 - V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
    <script type='module'>
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: 'AIzaSyByepfQv2Dm_pAVnbtJWv5EOf0q_HczI5M',
            authDomain: 'marketing-dashboardv1.firebaseapp.com',
            projectId: 'marketing-dashboardv1',
            storageBucket: 'marketing-dashboardv1.firebasestorage.app',
            messagingSenderId: '619601090265',
            appId: '1:619601090265:web:149ad6e8836556670e10c8'
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.firestoreFunctions = { collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot };
    </script>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        header h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .header-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center;
        }
        .stat-icon { font-size: 36px; margin-bottom: 10px; }
        .stat-value { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .stat-card.completed .stat-value { color: #10b981; }
        .stat-card.progress .stat-value { color: #f59e0b; }
        .stat-card.pending .stat-value { color: #6b7280; }
        .stat-card.overdue .stat-value { color: #ef4444; }
        .stat-label { color: #666; font-size: 14px; }
        
        .view-tabs {
            display: flex; gap: 15px; margin-bottom: 20px;
            justify-content: center; flex-wrap: wrap;
        }
        .view-tab {
            padding: 12px 25px; border: 2px solid white; border-radius: 10px;
            background: rgba(255,255,255,0.2); color: white; cursor: pointer;
            font-size: 15px; font-weight: 600; transition: all 0.3s;
        }
        .view-tab:hover { background: rgba(255,255,255,0.3); }
        .view-tab.active { background: white; color: #667eea; }
        
        .group-tabs, .person-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .group-tab, .person-tab {
            padding: 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .group-tab:hover, .person-tab:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .group-tab.active, .person-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .tab-count {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .group-tab.active .tab-count, .person-tab.active .tab-count {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .group-select-container {
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        .group-select-label { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 15px; }
        .group-select, .person-select {
            width: 100%; padding: 15px 20px; font-size: 16px;
            border: 2px solid #e5e7eb; border-radius: 12px;
            background: white; color: #333; cursor: pointer; font-weight: 500;
        }
        .group-select:focus, .person-select:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .tasks-container { display: grid; gap: 15px; }
        .task-card {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #ddd; transition: all 0.3s;
        }
        .task-card:hover { box-shadow: 0 5px 25px rgba(0,0,0,0.15); }
        .task-card.completed { border-left-color: #10b981; opacity: 0.9; }
        .task-card.inprogress { border-left-color: #f59e0b; }
        .task-card.pending { border-left-color: #6b7280; }
        .task-card.overdue { border-left-color: #ef4444; background: #fef2f2; }
        
        .bulk-actions-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 30px; border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: none; align-items: center; gap: 15px; z-index: 999;
        }
        .bulk-actions-bar.show { display: flex; }
        .bulk-count { font-weight: 600; color: #333; }
        .bulk-btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.2s;
        }
        .bulk-btn:hover { transform: translateY(-2px); }
        .bulk-btn.complete { background: #10b981; color: white; }
        .bulk-btn.delete { background: #ef4444; color: white; }
        .bulk-btn.select-all { background: #3b82f6; color: white; }
        .bulk-btn.cancel { background: #6b7280; color: white; }
        
        .task-checkbox {
            width: 20px; height: 20px; cursor: pointer;
            margin-right: 10px; transform: scale(1.2);
        }
        
        .selection-area {
            display: none;
            align-items: center;
        }
        .selection-area.show {
            display: flex;
        }
        
        .submission-section {
            margin-top: 15px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 8px;
            border-left: 3px solid #10b981;
        }
        
        .submission-label {
            font-size: 13px;
            color: #065f46;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .submission-content {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .submission-link {
            font-size: 12px;
            color: #0891b2;
            word-break: break-all;
        }
        
        .submission-file {
            font-size: 12px;
            color: #059669;
        }
        
        .submit-btn {
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .submit-btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .task-actions {
            display: flex; gap: 8px; margin-bottom: 10px; justify-content: space-between;
            align-items: center;
        }
        .task-action-btns {
            display: flex; gap: 8px;
        }
        .task-action-btn {
            padding: 5px 10px; border: none; border-radius: 5px;
            cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .task-action-btn.edit { background: #3b82f6; color: white; }
        .task-action-btn.delete { background: #ef4444; color: white; }
        
        .task-status-badge {
            display: inline-block; padding: 8px 16px; border-radius: 8px;
            font-size: 15px; font-weight: 600; margin-bottom: 15px;
            cursor: pointer; transition: all 0.2s;
        }
        .task-status-badge:hover { transform: scale(1.05); }
        .task-status-badge.completed { background: #d1fae5; color: #065f46; }
        .task-status-badge.inprogress { background: #fef3c7; color: #92400e; }
        .task-status-badge.pending { background: #f3f4f6; color: #374151; }
        .task-status-badge.overdue { background: #fee2e2; color: #991b1b; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .task-header { margin-bottom: 10px; }
        .task-title { font-size: 18px; font-weight: 600; color: #333; }
        .task-group { font-size: 13px; color: #667eea; font-weight: 600; margin-bottom: 5px; }
        .task-program { font-size: 12px; color: #8b5cf6; margin-bottom: 10px; }
        .task-info { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
        .task-meta {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px; margin-top: 10px; font-size: 13px; color: #666;
        }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        
        .progress-bar {
            width: 100%; height: 8px; background: #e5e7eb;
            border-radius: 10px; margin-top: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; padding: 30px; border-radius: 15px;
            max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { font-size: 24px; font-weight: 600; margin-bottom: 20px; color: #333; }
        
        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            display: block; margin-bottom: 5px; color: #555; font-weight: 500;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            header h1 { font-size: 22px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Bảng Theo Dõi Marketing 2026</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="openAddModal()">➕ Thêm công việc</button>
                <button class="btn btn-primary" id="selectModeBtn" onclick="toggleSelectionMode()">☑️ Chọn nhiều</button>
                <button class="btn btn-primary" onclick="exportData()">💾 Xuất dữ liệu</button>
                <button class="btn btn-danger" onclick="importJSON()">📥 Nhập JSON</button>
                <button class="btn btn-primary" onclick="importExcel()">📊 Nhập Excel</button>
            </div>
            <div style="margin-top:15px;color:#666;font-size:14px;">
                Cập nhật: <span id="lastUpdate"></span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card completed">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Hoàn thành</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="inProgressTasks">0</div>
                <div class="stat-label">Đang thực hiện</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="pendingTasks">0</div>
                <div class="stat-label">Chưa bắt đầu</div>
            </div>
            <div class="stat-card overdue">
                <div class="stat-icon">⚠️</div>
                <div class="stat-value" id="overdueTasks">0</div>
                <div class="stat-label">Quá hạn</div>
            </div>
        </div>

        <div class="view-tabs">
            <button class="view-tab active" onclick="switchView('all')">📋 Tất cả</button>
            <button class="view-tab" onclick="switchView('group')">📁 Theo nhóm việc</button>
            <button class="view-tab" onclick="switchView('people')">👥 Theo người</button>
        </div>

        <div id="groupTabs" class="group-tabs" style="display:none;"></div>

        <div id="personTabs" class="person-tabs" style="display:none;"></div>

        <div id="groupSelectContainer" class="group-select-container" style="display:none;">
            <div class="group-select-label">📁 Chọn nhóm việc:</div>
            <select id="groupSelect" class="group-select" onchange="switchGroup(this.value)"></select>
        </div>

        <div id="personSelectContainer" class="group-select-container" style="display:none;">
            <div class="group-select-label">👤 Chọn người xem:</div>
            <select id="personSelect" class="person-select" onchange="switchPerson(this.value)"></select>
        </div>

        <div class="tasks-container" id="tasksContainer"></div>
    </div>

    <!-- Bulk Actions Bar -->
    <div class="bulk-actions-bar" id="bulkActionsBar">
        <span class="bulk-count">Đã chọn: <strong id="selectedCount">0</strong></span>
        <button class="bulk-btn select-all" onclick="selectAll()">☑️ Chọn tất cả</button>
        <button class="bulk-btn complete" onclick="bulkComplete()">✅ Hoàn thành</button>
        <button class="bulk-btn delete" onclick="bulkDelete()">🗑️ Xóa</button>
        <button class="bulk-btn cancel" onclick="exitSelectionMode()">✕ Thoát</button>
    </div>

    <!-- Modal Nộp bài -->
    <div class="modal" id="submitModal">
        <div class="modal-content">
            <div class="modal-header">📤 Nộp bài</div>
            <form id="submitForm" onsubmit="saveSubmission(event)">
                <div class="form-group">
                    <label>Link nộp bài (Google Drive, Figma, ...)</label>
                    <input type="url" name="submissionLink" placeholder="https://...">
                </div>
                
                <div class="form-group">
                    <label>Ghi chú</label>
                    <input type="text" name="submissionNote" placeholder="VD: File đã gửi email, Đã in 100 tờ rơi">
                </div>
                
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:10px;">
                        <input type="checkbox" id="markCompleteCheck" style="width:20px;height:20px;">
                        <span>Đánh dấu công việc đã hoàn thành</span>
                    </label>
                </div>
                
                <input type="hidden" name="taskId">
                
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeSubmitModal()" style="background:#6b7280;color:white;">Hủy</button>
                    <button type="submit" class="btn btn-success">Nộp</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Thêm công việc mới</div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nhóm việc *</label>
                        <input type="text" name="group" required placeholder="VD: Marketing Online">
                    </div>
                    <div class="form-group">
                        <label>Chương trình *</label>
                        <input type="text" name="program" required placeholder="VD: Social Media">
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label>Công việc cụ thể *</label>
                    <input type="text" name="title" required placeholder="VD: Đăng bài Facebook">
                </div>
                
                <div class="form-group full-width">
                    <label>Mô tả</label>
                    <textarea name="description" placeholder="Mô tả chi tiết công việc..."></textarea>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Người điều phối *</label>
                        <input type="text" name="coordinator" required>
                    </div>
                    <div class="form-group">
                        <label>Người thực hiện *</label>
                        <input type="text" name="assignee" required>
                    </div>
                    <div class="form-group">
                        <label>Người duyệt *</label>
                        <input type="text" name="approver" required>
                    </div>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Deadline *</label>
                        <input type="date" name="deadline" required>
                    </div>
                    <div class="form-group">
                        <label>Tần suất *</label>
                        <select name="frequency" required>
                            <option value="Một lần">Một lần</option>
                            <option value="Hàng ngày">Hàng ngày</option>
                            <option value="Hàng tuần">Hàng tuần</option>
                            <option value="Hàng tháng">Hàng tháng</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Trạng thái *</label>
                        <select name="status" required>
                            <option value="pending">Chưa bắt đầu</option>
                            <option value="inprogress">Đang thực hiện</option>
                            <option value="completed">Hoàn thành</option>
                            <option value="overdue">Quá hạn</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label>Đầu ra bắt buộc *</label>
                    <input type="text" name="requiredOutput" required placeholder="VD: 1 bài post + 3 ảnh">
                </div>
                
                <div class="form-group">
                    <label>Tiến độ (%) *</label>
                    <input type="number" name="progress" min="0" max="100" value="0" required>
                </div>
                
                <div class="form-group full-width">
                    <label>Link nộp bài (tùy chọn)</label>
                    <input type="url" name="submissionLink" placeholder="https://...">
                </div>
                
                <div class="form-group full-width">
                    <label>Ghi chú nộp bài (tùy chọn)</label>
                    <input type="text" name="submissionNote" placeholder="Tên file hoặc ghi chú">
                </div>
                
                <input type="hidden" name="id">
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()" style="background:#6b7280;color:white;">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tasksData = [];
        let currentView = 'all';
        let currentGroup = null;
        let currentPerson = null;
        let editingId = null;
        let selectedTasks = new Set();
        let selectionMode = false;

        // Dữ liệu mẫu
        const defaultData = [
            {
                id: Date.now() + 1,
                group: "Marketing Online",
                program: "Social Media",
                title: "Đăng bài Facebook",
                coordinator: "Nguyễn Văn A",
                assignee: "Trần Thị B",
                approver: "Lê Văn C",
                deadline: "2026-01-15",
                frequency: "Hàng ngày",
                requiredOutput: "1 bài post + ảnh",
                status: "completed",
                description: "Đăng bài quảng cáo sản phẩm",
                progress: 100,
                lastRecurDate: "2026-01-15",
                submissionLink: "",
                submissionNote: ""
            },
            {
                id: Date.now() + 2,
                group: "Marketing Offline",
                program: "Sự kiện",
                title: "Chuẩn bị booth triển lãm",
                coordinator: "Phạm Thị D",
                assignee: "Nguyễn Văn A",
                approver: "Hoàng Văn E",
                deadline: "2026-01-20",
                frequency: "Một lần",
                requiredOutput: "Booth + catalog",
                status: "inprogress",
                description: "Setup booth cho triển lãm",
                progress: 60,
                lastRecurDate: null,
                submissionLink: "https://drive.google.com/example",
                submissionNote: "File thiết kế booth"
            }
        ];

        // Load dữ liệu
        function loadData() {
            const saved = localStorage.getItem('marketingTasksV2');
            if (saved) {
                tasksData = JSON.parse(saved);
                checkRecurringTasks();
                checkOverdueTasks();
            } else {
                tasksData = defaultData;
                saveToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('marketingTasksV2', JSON.stringify(tasksData));
        }

        // Kiểm tra và tạo task lặp lại
        function checkRecurringTasks() {
            const today = new Date().toISOString().split('T')[0];
            let updated = false;

            tasksData.forEach(task => {
                if (task.frequency === 'Hàng ngày' && task.lastRecurDate !== today) {
                    // Tạo task mới cho hôm nay
                    const newTask = {
                        ...task,
                        id: Date.now() + Math.random(),
                        status: 'pending',
                        progress: 0,
                        deadline: today,
                        lastRecurDate: today,
                        submissionLink: '',
                        submissionNote: ''
                    };
                    tasksData.push(newTask);
                    task.lastRecurDate = today;
                    updated = true;
                }
            });

            if (updated) saveToStorage();
        }

        // Kiểm tra quá hạn
        function checkOverdueTasks() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            let updated = false;
            tasksData.forEach(task => {
                if (task.status !== 'completed') {
                    const deadline = new Date(task.deadline);
                    deadline.setHours(0, 0, 0, 0);
                    
                    if (deadline < today) {
                        task.status = 'overdue';
                        updated = true;
                    }
                }
            });
            
            if (updated) saveToStorage();
        }

        // Cập nhật thống kê
        function updateStats() {
            checkRecurringTasks();
            checkOverdueTasks();
            
            const completed = tasksData.filter(t => t.status === 'completed').length;
            const inProgress = tasksData.filter(t => t.status === 'inprogress').length;
            const pending = tasksData.filter(t => t.status === 'pending').length;
            const overdue = tasksData.filter(t => t.status === 'overdue').length;

            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('inProgressTasks').textContent = inProgress;
            document.getElementById('pendingTasks').textContent = pending;
            document.getElementById('overdueTasks').textContent = overdue;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('vi-VN');
        }

        // Chuyển nhóm
        function switchGroup(group) {
            currentGroup = group;
            
            // Update active state
            document.querySelectorAll('.group-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.group-tab').classList.add('active');
            
            const filtered = tasksData.filter(t => t.group === group);
            renderTasks(filtered);
        }

        // Chuyển người
        function switchPerson(person) {
            currentPerson = person;
            
            // Update active state
            document.querySelectorAll('.person-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.person-tab').classList.add('active');
            
            const filtered = tasksData.filter(t => t.assignee === person);
            renderTasks(filtered);
        }

        // Toggle selection mode
        function toggleSelectionMode() {
            selectionMode = !selectionMode;
            const btn = document.getElementById('selectModeBtn');
            
            if (selectionMode) {
                btn.textContent = '✕ Hủy chọn';
                btn.style.background = '#6b7280';
                updateBulkActionsBar();
            } else {
                btn.textContent = '☑️ Chọn nhiều';
                btn.style.background = '#667eea';
                selectedTasks.clear();
                document.getElementById('bulkActionsBar').classList.remove('show');
            }
            
            switchView(currentView);
        }

        // Exit selection mode
        function exitSelectionMode() {
            selectionMode = false;
            selectedTasks.clear();
            const btn = document.getElementById('selectModeBtn');
            btn.textContent = '☑️ Chọn nhiều';
            btn.style.background = '#667eea';
            document.getElementById('bulkActionsBar').classList.remove('show');
            switchView(currentView);
        }

        // Select all visible tasks
        function selectAll() {
            // Get current displayed tasks
            let displayedTasks = [];
            
            if (currentView === 'all') {
                displayedTasks = tasksData;
            } else if (currentView === 'group' && currentGroup) {
                displayedTasks = tasksData.filter(t => t.group === currentGroup);
            } else if (currentView === 'people' && currentPerson) {
                displayedTasks = tasksData.filter(t => t.assignee === currentPerson);
            }
            
            // Select all displayed tasks
            displayedTasks.forEach(task => {
                selectedTasks.add(task.id);
            });
            
            // Update checkboxes
            document.querySelectorAll('.task-checkbox').forEach(checkbox => {
                checkbox.checked = true;
            });
            
            updateBulkActionsBar();
        }

        // Toggle task selection
        function toggleTask(id) {
            if (selectedTasks.has(id)) {
                selectedTasks.delete(id);
            } else {
                selectedTasks.add(id);
            }
            updateBulkActionsBar();
        }

        // Update bulk actions bar
        function updateBulkActionsBar() {
            if (!selectionMode) return;
            
            const bar = document.getElementById('bulkActionsBar');
            const count = document.getElementById('selectedCount');
            
            bar.classList.add('show');
            count.textContent = selectedTasks.size;
        }

        // Bulk complete
        function bulkComplete() {
            if (selectedTasks.size === 0) {
                alert('Chưa chọn công việc nào!');
                return;
            }
            
            if (confirm(`Đánh dấu hoàn thành ${selectedTasks.size} công việc?`)) {
                selectedTasks.forEach(id => {
                    const task = tasksData.find(t => t.id === id);
                    if (task) {
                        task.status = 'completed';
                        task.progress = 100;
                    }
                });
                
                saveToStorage();
                updateStats();
                exitSelectionMode();
            }
        }

        // Bulk delete
        function bulkDelete() {
            if (selectedTasks.size === 0) {
                alert('Chưa chọn công việc nào!');
                return;
            }
            
            if (confirm(`Xóa ${selectedTasks.size} công việc? Không thể hoàn tác!`)) {
                const selectedIds = Array.from(selectedTasks);
                tasksData = tasksData.filter(t => !selectedIds.includes(t.id));
                saveToStorage();
                updateStats();
                exitSelectionMode();
            }
        }

        // Chuyển view
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-tab').forEach(tab => tab.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            
            document.getElementById('groupTabs').style.display = 'none';
            document.getElementById('personTabs').style.display = 'none';
            
            if (view === 'all') {
                renderTasks(tasksData);
            } else if (view === 'group') {
                document.getElementById('groupTabs').style.display = 'flex';
                renderGroupTabs();
            } else if (view === 'people') {
                document.getElementById('personTabs').style.display = 'flex';
                renderPersonTabs();
            }
        }

        // Render group tabs
        function renderGroupTabs() {
            const groupsMap = {};
            
            // Đếm số công việc của mỗi nhóm
            tasksData.forEach(task => {
                if (!groupsMap[task.group]) {
                    groupsMap[task.group] = 0;
                }
                groupsMap[task.group]++;
            });
            
            const groups = Object.keys(groupsMap).sort();
            const container = document.getElementById('groupTabs');
            
            if (groups.length === 0) {
                container.innerHTML = '<div style="padding:20px;color:#666;">Chưa có nhóm việc nào</div>';
                return;
            }
            
            container.innerHTML = groups.map((group, index) => {
                const count = groupsMap[group];
                const isActive = (currentGroup === group) || (currentGroup === null && index === 0);
                
                return `
                    <button class="group-tab ${isActive ? 'active' : ''}" onclick="switchGroup('${group.replace(/'/g, "\\'")}')">
                        <span>${group}</span>
                        <span class="tab-count">${count}</span>
                    </button>
                `;
            }).join('');
            
            // Nếu chưa chọn nhóm nào, chọn nhóm đầu tiên
            if (currentGroup === null && groups.length > 0) {
                currentGroup = groups[0];
            }
            
            switchGroup(currentGroup);
        }

        // Render person tabs
        function renderPersonTabs() {
            const peopleMap = {};
            
            // Đếm số công việc của mỗi người
            tasksData.forEach(task => {
                if (!peopleMap[task.assignee]) {
                    peopleMap[task.assignee] = 0;
                }
                peopleMap[task.assignee]++;
            });
            
            const people = Object.keys(peopleMap).sort();
            const container = document.getElementById('personTabs');
            
            if (people.length === 0) {
                container.innerHTML = '<div style="padding:20px;color:#666;">Chưa có người thực hiện nào</div>';
                return;
            }
            
            container.innerHTML = people.map((person, index) => {
                const count = peopleMap[person];
                const isActive = (currentPerson === person) || (currentPerson === null && index === 0);
                
                return `
                    <button class="person-tab ${isActive ? 'active' : ''}" onclick="switchPerson('${person.replace(/'/g, "\\'")}')">
                        <span>${person}</span>
                        <span class="tab-count">${count}</span>
                    </button>
                `;
            }).join('');
            
            // Nếu chưa chọn người nào, chọn người đầu tiên
            if (currentPerson === null && people.length > 0) {
                currentPerson = people[0];
            }
            
            switchPerson(currentPerson);
        }

        // Hiển thị tasks
        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            
            if (tasks.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:white;font-size:18px;">Không có công việc nào</div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-card ${task.status}">
                    <div class="task-actions">
                        <div class="selection-area ${selectionMode ? 'show' : ''}">
                            <input type="checkbox" class="task-checkbox" 
                                   id="check-${task.id}" 
                                   onchange="toggleTask(${task.id})"
                                   ${selectedTasks.has(task.id) ? 'checked' : ''}>
                            <label for="check-${task.id}" style="cursor:pointer;user-select:none;">Chọn</label>
                        </div>
                        <div class="task-action-btns">
                            <button class="task-action-btn edit" onclick="editTask(${task.id})">✏️ Sửa</button>
                            <button class="task-action-btn delete" onclick="deleteTask(${task.id})">🗑️ Xóa</button>
                        </div>
                    </div>
                    <span class="task-status-badge ${task.status}" onclick="changeStatus(${task.id})" title="Click để đổi trạng thái">
                        ${getStatusText(task.status)}
                    </span>
                    <div class="task-group">📁 ${task.group} » ${task.program}</div>
                    <div class="task-header">
                        <div class="task-title">${task.title}</div>
                    </div>
                    <div class="task-info">${task.description || ''}</div>
                    <div class="task-meta">
                        <div class="meta-item">📅 Deadline: ${formatDate(task.deadline)}</div>
                        <div class="meta-item">🔄 Tần suất: ${task.frequency}</div>
                        <div class="meta-item">👤 Thực hiện: ${task.assignee}</div>
                        <div class="meta-item">📋 Điều phối: ${task.coordinator}</div>
                        <div class="meta-item">✅ Duyệt: ${task.approver}</div>
                        <div class="meta-item">📊 Tiến độ: ${task.progress}%</div>
                    </div>
                    <div style="margin-top:10px;padding:10px;background:#f0f9ff;border-radius:8px;">
                        <strong style="color:#0369a1;">📦 Đầu ra:</strong> ${task.requiredOutput}
                    </div>
                    ${task.submissionLink || task.submissionNote ? `
                    <div class="submission-section">
                        <div class="submission-label">📎 Đã nộp bài:</div>
                        <div class="submission-content">
                            ${task.submissionLink ? `<a href="${task.submissionLink}" target="_blank" class="submission-link" onclick="event.stopPropagation()">🔗 ${task.submissionLink}</a>` : ''}
                            ${task.submissionNote ? `<span class="submission-file">📄 ${task.submissionNote}</span>` : ''}
                        </div>
                    </div>
                    ` : task.status !== 'completed' ? `
                    <div style="margin-top:10px;">
                        <button class="submit-btn" onclick="openSubmitModal(${task.id})">📤 Nộp bài</button>
                    </div>
                    ` : ''}
                    ${task.status !== 'completed' && task.status !== 'pending' ? `
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${task.progress}%"></div>
                    </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Mở modal nộp bài
        function openSubmitModal(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;
            
            const form = document.getElementById('submitForm');
            form.submissionLink.value = task.submissionLink || '';
            form.submissionNote.value = task.submissionNote || '';
            form.taskId.value = id;
            document.getElementById('markCompleteCheck').checked = false;
            
            document.getElementById('submitModal').classList.add('active');
        }

        // Đóng modal nộp bài
        function closeSubmitModal() {
            document.getElementById('submitModal').classList.remove('active');
        }

        // Lưu nộp bài
        function saveSubmission(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const taskId = parseInt(formData.get('taskId'));
            
            const task = tasksData.find(t => t.id === taskId);
            if (!task) return;
            
            task.submissionLink = formData.get('submissionLink') || '';
            task.submissionNote = formData.get('submissionNote') || '';
            
            // Nếu tick hoàn thành
            if (document.getElementById('markCompleteCheck').checked) {
                task.status = 'completed';
                task.progress = 100;
            }
            
            saveToStorage();
            closeSubmitModal();
            updateStats();
            switchView(currentView);
            
            if (task.status === 'completed') {
                alert('Đã nộp bài và đánh dấu hoàn thành! ✅');
            } else {
                alert('Đã nộp bài thành công! 📤');
            }
        }

        // Mở modal thêm
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Thêm công việc mới';
            document.getElementById('taskForm').reset();
            document.getElementById('taskModal').classList.add('active');
        }

        // Sửa task
        function editTask(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Sửa công việc';
            const form = document.getElementById('taskForm');
            
            form.group.value = task.group;
            form.program.value = task.program;
            form.title.value = task.title;
            form.description.value = task.description || '';
            form.coordinator.value = task.coordinator;
            form.assignee.value = task.assignee;
            form.approver.value = task.approver;
            form.deadline.value = task.deadline;
            form.frequency.value = task.frequency;
            form.requiredOutput.value = task.requiredOutput;
            form.status.value = task.status;
            form.progress.value = task.progress;
            form.submissionLink.value = task.submissionLink || '';
            form.submissionNote.value = task.submissionNote || '';
            form.id.value = id;
            
            document.getElementById('taskModal').classList.add('active');
        }

        // Xóa task
        function deleteTask(id) {
            if (confirm('Bạn có chắc muốn xóa công việc này?')) {
                tasksData = tasksData.filter(t => t.id !== id);
                saveToStorage();
                updateStats();
                switchView(currentView);
            }
        }

        // Lưu task
        function saveTask(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            const task = {
                id: editingId || Date.now(),
                group: formData.get('group'),
                program: formData.get('program'),
                title: formData.get('title'),
                description: formData.get('description'),
                coordinator: formData.get('coordinator'),
                assignee: formData.get('assignee'),
                approver: formData.get('approver'),
                deadline: formData.get('deadline'),
                frequency: formData.get('frequency'),
                requiredOutput: formData.get('requiredOutput'),
                status: formData.get('status'),
                progress: parseInt(formData.get('progress')),
                submissionLink: formData.get('submissionLink') || '',
                submissionNote: formData.get('submissionNote') || '',
                lastRecurDate: formData.get('frequency') === 'Hàng ngày' ? new Date().toISOString().split('T')[0] : null
            };

            if (editingId) {
                const index = tasksData.findIndex(t => t.id === editingId);
                tasksData[index] = task;
            } else {
                tasksData.push(task);
            }

            saveToStorage();
            closeModal();
            updateStats();
            switchView(currentView);
        }

        // Đổi trạng thái
        function changeStatus(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;
            
            if (task.status === 'pending') {
                task.status = 'inprogress';
                task.progress = 50;
            } else if (task.status === 'inprogress') {
                task.status = 'completed';
                task.progress = 100;
            } else if (task.status === 'completed') {
                task.status = 'pending';
                task.progress = 0;
            } else if (task.status === 'overdue') {
                task.status = 'inprogress';
                task.progress = 50;
            }
            
            saveToStorage();
            updateStats();
            switchView(currentView);
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        function getStatusText(status) {
            const statusMap = {
                'completed': 'Hoàn thành',
                'inprogress': 'Đang thực hiện',
                'pending': 'Chưa bắt đầu',
                'overdue': 'Quá hạn'
            };
            return statusMap[status] || status;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN');
        }

        // Export
        function exportData() {
            const dataStr = JSON.stringify(tasksData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marketing-tasks-v2-' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
        }

        // Import JSON
        function importJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (confirm('Nhập dữ liệu sẽ ghi đè dữ liệu hiện tại. Tiếp tục?')) {
                            tasksData = data;
                            saveToStorage();
                            updateStats();
                            switchView('all');
                            alert('Nhập dữ liệu thành công!');
                        }
                    } catch (err) {
                        alert('File không đúng định dạng!');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Import Excel
        function importExcel() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet);
                        
                        if (rows.length === 0) {
                            alert('File Excel không có dữ liệu!');
                            return;
                        }
                        
                        const convertedData = rows.map((row, index) => {
                            // Linh hoạt xử lý trạng thái
                            let status = 'pending';
                            let progress = 0;
                            
                            const statusText = (row['Trạng thái'] || row['Status'] || '').toString().toLowerCase();
                            if (statusText.includes('hoàn thành') || statusText.includes('completed')) {
                                status = 'completed';
                                progress = 100;
                            } else if (statusText.includes('đang') || statusText.includes('progress')) {
                                status = 'inprogress';
                                progress = parseInt(row['Tiến độ %'] || row['Progress'] || 50);
                            }
                            
                            // Xử lý deadline an toàn
                            let deadline = '';
                            const deadlineValue = row['Deadline'] || row['Ngày deadline'] || row['Hạn chót'] || '';
                            if (deadlineValue) {
                                try {
                                    if (typeof deadlineValue === 'number') {
                                        // Excel date serial number
                                        const excelEpoch = new Date(1899, 11, 30);
                                        const date = new Date(excelEpoch.getTime() + deadlineValue * 86400000);
                                        const year = date.getFullYear();
                                        const month = String(date.getMonth() + 1).padStart(2, '0');
                                        const day = String(date.getDate()).padStart(2, '0');
                                        deadline = `${year}-${month}-${day}`;
                                    } else if (deadlineValue instanceof Date) {
                                        // JS Date object
                                        const year = deadlineValue.getFullYear();
                                        const month = String(deadlineValue.getMonth() + 1).padStart(2, '0');
                                        const day = String(deadlineValue.getDate()).padStart(2, '0');
                                        deadline = `${year}-${month}-${day}`;
                                    } else {
                                        // String format
                                        const str = deadlineValue.toString();
                                        if (str.includes('/')) {
                                            // DD/MM/YYYY
                                            const parts = str.split('/');
                                            if (parts.length === 3) {
                                                deadline = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                                            }
                                        } else if (str.includes('-')) {
                                            // YYYY-MM-DD
                                            deadline = str.split('T')[0];
                                        }
                                    }
                                } catch (e) {
                                    console.warn('Lỗi xử lý deadline:', e);
                                }
                            }
                            
                            // Nếu deadline không hợp lệ, dùng ngày hiện tại
                            if (!deadline || deadline === 'NaN-NaN-NaN') {
                                const today = new Date();
                                deadline = today.toISOString().split('T')[0];
                            }
                            
                            // Linh hoạt mapping các trường - bỏ qua các cột không liên quan
                            return {
                                id: Date.now() + index + Math.random(),
                                group: row['Nhóm việc'] || row['Group'] || row['Nhom viec'] || 'Chưa phân nhóm',
                                program: row['Chương trình'] || row['Program'] || row['Chuong trinh'] || '',
                                title: row['Công việc cụ thể'] || row['Công việc'] || row['Task'] || row['Title'] || row['Cong viec'] || 'Công việc ' + (index + 1),
                                description: row['Mô tả'] || row['Description'] || row['Mo ta'] || row['Ghi chú'] || '',
                                coordinator: row['Người điều phối'] || row['Coordinator'] || row['Nguoi dieu phoi'] || row['Điều phối'] || '',
                                assignee: row['Người thực hiện'] || row['Assignee'] || row['Nguoi thuc hien'] || row['Thực hiện'] || 'Chưa phân công',
                                approver: row['Người duyệt'] || row['Approver'] || row['Nguoi duyet'] || row['Duyệt'] || '',
                                deadline: deadline,
                                frequency: row['Tần suất'] || row['Frequency'] || row['Tan suat'] || 'Một lần',
                                requiredOutput: row['Đầu ra bắt buộc'] || row['Required Output'] || row['Dau ra'] || row['Đầu ra'] || '',
                                status: status,
                                progress: progress,
                                submissionLink: '',
                                submissionNote: '',
                                lastRecurDate: null
                            };
                        }).filter(task => task.title && task.title !== '' && task.title !== 'Công việc NaN'); // Bỏ qua dòng trống
                        
                        if (confirm(`Tìm thấy ${convertedData.length} công việc. Nhập dữ liệu sẽ ghi đè dữ liệu hiện tại. Tiếp tục?`)) {
                            tasksData = convertedData;
                            saveToStorage();
                            updateStats();
                            switchView('all');
                            
                            // Thông báo thành công không có alert lỗi
                            const successMsg = `✅ Import thành công!\n\n` +
                                             `📊 Tổng: ${convertedData.length} công việc\n` +
                                             `✓ Hoàn thành: ${convertedData.filter(t => t.status === 'completed').length}\n` +
                                             `⏳ Đang làm: ${convertedData.filter(t => t.status === 'inprogress').length}\n` +
                                             `📋 Chưa bắt đầu: ${convertedData.filter(t => t.status === 'pending').length}`;
                            
                            alert(successMsg);
                        }
                    } catch (err) {
                        console.error('Excel import error:', err);
                        alert('⚠️ Có lỗi khi đọc file Excel.\n\nVui lòng kiểm tra:\n- File có đúng định dạng .xlsx hoặc .xls\n- Có cột "Công việc cụ thể" hoặc "Task"\n- Dữ liệu bắt đầu từ dòng 2\n\nLỗi: ' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        }

        // Đóng modal khi click ngoài
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target.id === 'taskModal') closeModal();
        });
        
        document.getElementById('submitModal').addEventListener('click', (e) => {
            if (e.target.id === 'submitModal') closeSubmitModal();
        });

        // Khởi tạo
        loadData();
        updateStats();
        renderTasks(tasksData);
    </script>
</body>
</html>
