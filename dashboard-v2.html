<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Marketing 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; text-align: center;
        }
        header h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .header-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center;
        }
        .stat-icon { font-size: 36px; margin-bottom: 10px; }
        .stat-value { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .stat-card.completed .stat-value { color: #10b981; }
        .stat-card.progress .stat-value { color: #f59e0b; }
        .stat-card.pending .stat-value { color: #6b7280; }
        .stat-card.overdue .stat-value { color: #ef4444; }
        .stat-label { color: #666; font-size: 14px; }
        
        .view-tabs {
            display: flex; gap: 15px; margin-bottom: 20px;
            justify-content: center; flex-wrap: wrap;
        }
        .view-tab {
            padding: 12px 25px; border: 2px solid white; border-radius: 10px;
            background: rgba(255,255,255,0.2); color: white; cursor: pointer;
            font-size: 15px; font-weight: 600; transition: all 0.3s;
        }
        .view-tab:hover { background: rgba(255,255,255,0.3); }
        .view-tab.active { background: white; color: #667eea; }
        
        .tabs-container {
            display: flex; gap: 10px; flex-wrap: wrap; padding: 15px;
            background: white; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        
        .tab-item {
            padding: 12px 20px; border: 2px solid #e5e7eb; border-radius: 10px;
            background: white; color: #333; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: all 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .tab-item:hover {
            border-color: #667eea; transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        .tab-item.active {
            background: #667eea; color: white; border-color: #667eea;
        }
        .tab-count {
            background: rgba(102, 126, 234, 0.1); color: #667eea;
            padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
        }
        .tab-item.active .tab-count {
            background: rgba(255, 255, 255, 0.3); color: white;
        }
        
        .tasks-container { display: grid; gap: 15px; }
        .task-card {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #ddd; transition: all 0.3s;
        }
        .task-card:hover { box-shadow: 0 5px 25px rgba(0,0,0,0.15); }
        .task-card.completed { border-left-color: #10b981; opacity: 0.9; }
        .task-card.inprogress { border-left-color: #f59e0b; }
        .task-card.pending { border-left-color: #6b7280; }
        .task-card.overdue { border-left-color: #ef4444; background: #fef2f2; }
        
        .bulk-actions-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 30px; border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: none; align-items: center; gap: 15px; z-index: 999;
        }
        .bulk-actions-bar.show { display: flex; }
        .bulk-count { font-weight: 600; color: #333; }
        .bulk-btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s;
        }
        .bulk-btn:hover { transform: translateY(-2px); }
        .bulk-btn.complete { background: #10b981; color: white; }
        .bulk-btn.delete { background: #ef4444; color: white; }
        .bulk-btn.select-all { background: #3b82f6; color: white; }
        .bulk-btn.cancel { background: #6b7280; color: white; }
        
        .task-checkbox {
            width: 20px; height: 20px; cursor: pointer;
            margin-right: 10px; transform: scale(1.2);
        }
        .selection-area { display: none; align-items: center; }
        .selection-area.show { display: flex; }
        
        .submission-section {
            margin-top: 15px; padding: 12px;
            background: #f0fdf4; border-radius: 8px;
            border-left: 3px solid #10b981;
        }
        .submission-label {
            font-size: 13px; color: #065f46;
            font-weight: 600; margin-bottom: 8px;
        }
        .submission-content {
            display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
        }
        .submission-link {
            font-size: 12px; color: #0891b2; word-break: break-all;
        }
        .submit-btn {
            padding: 8px 16px; background: #10b981; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 500; transition: all 0.2s;
        }
        .submit-btn:hover {
            background: #059669; transform: translateY(-2px);
        }
        
        .task-actions {
            display: flex; gap: 8px; margin-bottom: 10px;
            justify-content: space-between; align-items: center;
        }
        .task-action-btns { display: flex; gap: 8px; }
        .task-action-btn {
            padding: 5px 10px; border: none; border-radius: 5px;
            cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .task-action-btn.edit { background: #3b82f6; color: white; }
        .task-action-btn.delete { background: #ef4444; color: white; }
        
        .task-status-badge {
            display: inline-block; padding: 8px 16px; border-radius: 8px;
            font-size: 15px; font-weight: 600; margin-bottom: 15px;
            cursor: pointer; transition: all 0.2s;
        }
        .task-status-badge:hover { transform: scale(1.05); }
        .task-status-badge.completed { background: #d1fae5; color: #065f46; }
        .task-status-badge.inprogress { background: #fef3c7; color: #92400e; }
        .task-status-badge.pending { background: #f3f4f6; color: #374151; }
        .task-status-badge.overdue { background: #fee2e2; color: #991b1b; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .task-header { margin-bottom: 10px; }
        .task-title { font-size: 18px; font-weight: 600; color: #333; }
        .task-group { font-size: 13px; color: #667eea; font-weight: 600; margin-bottom: 5px; }
        .task-info { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
        .task-meta {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px; margin-top: 10px; font-size: 13px; color: #666;
        }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        
        .progress-bar {
            width: 100%; height: 8px; background: #e5e7eb;
            border-radius: 10px; margin-top: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; padding: 30px; border-radius: 15px;
            max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { font-size: 24px; font-weight: 600; margin-bottom: 20px; color: #333; }
        
        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            display: block; margin-bottom: 5px; color: #555; font-weight: 500;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            header h1 { font-size: 22px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Bảng Theo Dõi Marketing 2026</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="openAddModal()">➕ Thêm công việc</button>
                <button class="btn btn-primary" id="selectModeBtn" onclick="toggleSelectionMode()">☑️ Chọn nhiều</button>
                <button class="btn btn-primary" onclick="exportData()">💾 Xuất dữ liệu</button>
                <button class="btn btn-danger" onclick="importJSON()">📥 Nhập JSON</button>
                <button class="btn btn-primary" onclick="importExcel()">📊 Nhập Excel</button>
            </div>
            <div style="margin-top:15px;color:#666;font-size:14px;">
                Cập nhật: <span id="lastUpdate"></span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card completed">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Hoàn thành</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="inProgressTasks">0</div>
                <div class="stat-label">Đang thực hiện</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="pendingTasks">0</div>
                <div class="stat-label">Chưa bắt đầu</div>
            </div>
            <div class="stat-card overdue">
                <div class="stat-icon">⚠️</div>
                <div class="stat-value" id="overdueTasks">0</div>
                <div class="stat-label">Quá hạn</div>
            </div>
        </div>

        <div class="view-tabs">
            <button class="view-tab active" onclick="switchView('all')">📋 Tất cả</button>
            <button class="view-tab" onclick="switchView('group')">📁 Theo nhóm việc</button>
            <button class="view-tab" onclick="switchView('people')">👥 Theo người</button>
        </div>

        <div id="groupTabs" class="tabs-container" style="display:none;"></div>
        <div id="personTabs" class="tabs-container" style="display:none;"></div>

        <div class="tasks-container" id="tasksContainer"></div>
    </div>

    <div class="bulk-actions-bar" id="bulkActionsBar">
        <span class="bulk-count">Đã chọn: <strong id="selectedCount">0</strong></span>
        <button class="bulk-btn select-all" onclick="selectAll()">☑️ Chọn tất cả</button>
        <button class="bulk-btn complete" onclick="bulkComplete()">✅ Hoàn thành</button>
        <button class="bulk-btn delete" onclick="bulkDelete()">🗑️ Xóa</button>
        <button class="bulk-btn cancel" onclick="exitSelectionMode()">✕ Thoát</button>
    </div>

    <div class="modal" id="submitModal">
        <div class="modal-content">
            <div class="modal-header">📤 Link nộp bài</div>
            <form id="submitForm" onsubmit="saveSubmission(event)">
                <div class="form-group">
                    <label>Link nộp bài (Google Drive, Figma...)</label>
                    <input type="url" name="submissionLink" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Hoặc đẩy file</label>
                    <input type="file" name="submissionFile" id="submissionFile" accept="*/*">
                </div>
                <div class="form-group">
                    <label>Ghi chú</label>
                    <input type="text" name="submissionNote" placeholder="Tên file hoặc ghi chú">
                </div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:10px;">
                        <input type="checkbox" id="markCompleteCheck" style="width:20px;height:20px;">
                        <span>Đánh dấu công việc đã hoàn thành</span>
                    </label>
                </div>
                <input type="hidden" name="taskId">
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeSubmitModal()" style="background:#6b7280;color:white;">Hủy</button>
                    <button type="submit" class="btn btn-success">Nộp</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Thêm công việc mới</div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nhóm việc *</label>
                        <input type="text" name="group" required placeholder="VD: Marketing Online">
                    </div>
                    <div class="form-group">
                        <label>Chương trình *</label>
                        <input type="text" name="program" required placeholder="VD: Social Media">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Công việc cụ thể *</label>
                    <input type="text" name="title" required placeholder="VD: Đăng bài Facebook">
                </div>
                <div class="form-group full-width">
                    <label>Mô tả</label>
                    <textarea name="description" placeholder="Mô tả chi tiết..."></textarea>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Người điều phối *</label>
                        <input type="text" name="coordinator" required>
                    </div>
                    <div class="form-group">
                        <label>Người thực hiện * (phân cách bằng dấu phẩy)</label>
                        <input type="text" name="assignee" required placeholder="VD: Nguyễn A, Trần B">
                    </div>
                    <div class="form-group">
                        <label>Người duyệt *</label>
                        <input type="text" name="approver" required>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Deadline *</label>
                        <input type="date" name="deadline" required>
                    </div>
                    <div class="form-group">
                        <label>Tần suất *</label>
                        <select name="frequency" required>
                            <option value="Một lần">Một lần</option>
                            <option value="Hàng ngày">Hàng ngày</option>
                            <option value="Hàng tuần">Hàng tuần</option>
                            <option value="Hàng tháng">Hàng tháng</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Trạng thái *</label>
                        <select name="status" required>
                            <option value="pending">Chưa bắt đầu</option>
                            <option value="inprogress">Đang thực hiện</option>
                            <option value="completed">Hoàn thành</option>
                        </select>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Đầu ra bắt buộc *</label>
                    <input type="text" name="requiredOutput" required placeholder="VD: 1 bài post + 3 ảnh">
                </div>
                <div class="form-group">
                    <label>Tiến độ (%)</label>
                    <input type="number" name="progress" min="0" max="100" value="0">
                </div>
                <input type="hidden" name="id">
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()" style="background:#6b7280;color:white;">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
