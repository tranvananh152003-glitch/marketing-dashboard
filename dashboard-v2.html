<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Marketing 2026 - V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        header h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .header-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center;
        }
        .stat-icon { font-size: 36px; margin-bottom: 10px; }
        .stat-value { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .stat-card.completed .stat-value { color: #10b981; }
        .stat-card.progress .stat-value { color: #f59e0b; }
        .stat-card.pending .stat-value { color: #6b7280; }
        .stat-card.overdue .stat-value { color: #ef4444; }
        .stat-label { color: #666; font-size: 14px; }
        
        .view-tabs {
            display: flex; gap: 15px; margin-bottom: 20px;
            justify-content: center; flex-wrap: wrap;
        }
        .view-tab {
            padding: 12px 25px; border: 2px solid white; border-radius: 10px;
            background: rgba(255,255,255,0.2); color: white; cursor: pointer;
            font-size: 15px; font-weight: 600; transition: all 0.3s;
        }
        .view-tab:hover { background: rgba(255,255,255,0.3); }
        .view-tab.active { background: white; color: #667eea; }
        
        .group-select-container {
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        .group-select-label { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 15px; }
        .group-select, .person-select {
            width: 100%; padding: 15px 20px; font-size: 16px;
            border: 2px solid #e5e7eb; border-radius: 12px;
            background: white; color: #333; cursor: pointer; font-weight: 500;
        }
        .group-select:focus, .person-select:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .tasks-container { display: grid; gap: 15px; }
        .task-card {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #ddd; transition: all 0.3s;
        }
        .task-card:hover { box-shadow: 0 5px 25px rgba(0,0,0,0.15); }
        .task-card.completed { border-left-color: #10b981; opacity: 0.9; }
        .task-card.inprogress { border-left-color: #f59e0b; }
        .task-card.pending { border-left-color: #6b7280; }
        .task-card.overdue { border-left-color: #ef4444; background: #fef2f2; }
        
        .task-actions {
            display: flex; gap: 8px; margin-bottom: 10px; justify-content: flex-end;
        }
        .task-action-btn {
            padding: 5px 10px; border: none; border-radius: 5px;
            cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .task-action-btn.edit { background: #3b82f6; color: white; }
        .task-action-btn.delete { background: #ef4444; color: white; }
        
        .task-status-badge {
            display: inline-block; padding: 8px 16px; border-radius: 8px;
            font-size: 15px; font-weight: 600; margin-bottom: 15px;
            cursor: pointer; transition: all 0.2s;
        }
        .task-status-badge:hover { transform: scale(1.05); }
        .task-status-badge.completed { background: #d1fae5; color: #065f46; }
        .task-status-badge.inprogress { background: #fef3c7; color: #92400e; }
        .task-status-badge.pending { background: #f3f4f6; color: #374151; }
        .task-status-badge.overdue { background: #fee2e2; color: #991b1b; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .task-header { margin-bottom: 10px; }
        .task-title { font-size: 18px; font-weight: 600; color: #333; }
        .task-group { font-size: 13px; color: #667eea; font-weight: 600; margin-bottom: 5px; }
        .task-program { font-size: 12px; color: #8b5cf6; margin-bottom: 10px; }
        .task-info { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
        .task-meta {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px; margin-top: 10px; font-size: 13px; color: #666;
        }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        
        .progress-bar {
            width: 100%; height: 8px; background: #e5e7eb;
            border-radius: 10px; margin-top: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; padding: 30px; border-radius: 15px;
            max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { font-size: 24px; font-weight: 600; margin-bottom: 20px; color: #333; }
        
        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            display: block; margin-bottom: 5px; color: #555; font-weight: 500;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            header h1 { font-size: 22px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ðŸ“Š Báº£ng Theo DÃµi Marketing 2026</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="openAddModal()">âž• ThÃªm cÃ´ng viá»‡c</button>
                <button class="btn btn-primary" onclick="exportData()">ðŸ’¾ Xuáº¥t dá»¯ liá»‡u</button>
                <button class="btn btn-danger" onclick="importJSON()">ðŸ“¥ Nháº­p JSON</button>
                <button class="btn btn-primary" onclick="importExcel()">ðŸ“Š Nháº­p Excel</button>
            </div>
            <div style="margin-top:15px;color:#666;font-size:14px;">
                Cáº­p nháº­t: <span id="lastUpdate"></span>
            </div>

        <div class="stats-grid">
            <div class="stat-card completed">
                <div class="stat-icon">âœ…</div>
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">HoÃ n thÃ nh</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-icon">â³</div>
                <div class="stat-value" id="inProgressTasks">0</div>
                <div class="stat-label">Äang thá»±c hiá»‡n</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon">ðŸ“‹</div>
                <div class="stat-value" id="pendingTasks">0</div>
                <div class="stat-label">ChÆ°a báº¯t Ä‘áº§u</div>
            </div>
            <div class="stat-card overdue">
                <div class="stat-icon">âš ï¸</div>
                <div class="stat-value" id="overdueTasks">0</div>

            </div>
        </div>

        <div class="view-tabs">
            <button class="view-tab active" onclick="switchView('all')">ðŸ“‹ Táº¥t cáº£</button>
            <button class="view-tab" onclick="switchView('group')">ðŸ“ Theo nhÃ³m viá»‡c</button>
            <button class="view-tab" onclick="switchView('people')">ðŸ‘¥ Theo ngÆ°á»i</button>
        </div>

        <div id="groupSelectContainer" class="group-select-container" style="display:none;">
            <div class="group-select-label">ðŸ“ Chá»n nhÃ³m viá»‡c:</div>
            <select id="groupSelect" class="group-select" onchange="switchGroup(this.value)"></select>
        </div>

        <div id="personSelectContainer" class="group-select-container" style="display:none;">
            <div class="group-select-label">ðŸ‘¤ Chá»n ngÆ°á»i xem:</div>
            <select id="personSelect" class="person-select" onchange="switchPerson(this.value)"></select>

        <div class="tasks-container" id="tasksContainer"></div>

    <!-- Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">ThÃªm cÃ´ng viá»‡c má»›i</div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>NhÃ³m viá»‡c *</label>
                        <input type="text" name="group" required placeholder="VD: Marketing Online">
                    </div>
                    <div class="form-group">
                        <label>ChÆ°Æ¡ng trÃ¬nh *</label>
                        <input type="text" name="program" required placeholder="VD: Social Media">
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label>CÃ´ng viá»‡c cá»¥ thá»ƒ *</label>
                    <input type="text" name="title" required placeholder="VD: ÄÄƒng bÃ i Facebook">
                </div>
                
                <div class="form-group full-width">
                    <label>MÃ´ táº£</label>
                    <textarea name="description" placeholder="MÃ´ táº£ chi tiáº¿t cÃ´ng viá»‡c..."></textarea>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>NgÆ°á»i Ä‘iá»u phá»‘i *</label>
                        <input type="text" name="coordinator" required>
                    </div>
                    <div class="form-group">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Táº§n suáº¥t *</label>
                        <select name="frequency" required>
                            <option value="Má»™t láº§n">Má»™t láº§n</option>
                            <option value="HÃ ng ngÃ y">HÃ ng ngÃ y</option>

                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tráº¡ng thÃ¡i *</label>
                        <select name="status" required>
                            <option value="pending">ChÆ°a báº¯t Ä‘áº§u</option>
                            <option value="inprogress">Äang thá»±c hiá»‡n</option>
                            <option value="completed">HoÃ n thÃ nh</option>

                        </select>
                    </div>

                <div class="form-group full-width">

                </div>
                
                <div class="form-group">
                    <label>Tiáº¿n Ä‘á»™ (%) *</label>

                <input type="hidden" name="id">

    <script>
        let tasksData = [];
        let currentView = 'all';
        let currentGroup = null;
        let currentPerson = null;
        let editingId = null;

        // Dá»¯ liá»‡u máº«u
        const defaultData = [
            {
                id: Date.now() + 1,
                group: "Marketing Online",
                program: "Social Media",
                title: "ÄÄƒng bÃ i Facebook",
                coordinator: "Nguyá»…n VÄƒn A",
                assignee: "Tráº§n Thá»‹ B",
                approver: "LÃª VÄƒn C",
                deadline: "2026-01-15",
                frequency: "HÃ ng ngÃ y",
                requiredOutput: "1 bÃ i post + áº£nh",
                status: "completed",
                description: "ÄÄƒng bÃ i quáº£ng cÃ¡o sáº£n pháº©m",
                progress: 100,
                lastRecurDate: "2026-01-15"
            },
            {
                id: Date.now() + 2,
                group: "Marketing Offline",
                program: "Sá»± kiá»‡n",
                title: "Chuáº©n bá»‹ booth triá»ƒn lÃ£m",
                coordinator: "Pháº¡m Thá»‹ D",
                assignee: "Nguyá»…n VÄƒn A",
                approver: "HoÃ ng VÄƒn E",
                deadline: "2026-01-20",
                frequency: "Má»™t láº§n",
                requiredOutput: "Booth + catalog",
                status: "inprogress",
                description: "Setup booth cho triá»ƒn lÃ£m",
                progress: 60,
                lastRecurDate: null
            }
        ];

        // Load dá»¯ liá»‡u
        function loadData() {
            const saved = localStorage.getItem('marketingTasksV2');
            if (saved) {
                tasksData = JSON.parse(saved);
                checkRecurringTasks();
                checkOverdueTasks();
            } else {
                tasksData = defaultData;
                saveToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('marketingTasksV2', JSON.stringify(tasksData));
        }

        // Kiá»ƒm tra vÃ  táº¡o task láº·p láº¡i
        function checkRecurringTasks() {
            const today = new Date().toISOString().split('T')[0];
            let updated = false;

            tasksData.forEach(task => {
                if (false && task.frequency === 'HÃ ng ngÃ y' && task.lastRecurDate !== today) {
                    // Táº¡o task má»›i cho hÃ´m nay
                    const newTask = {
                        ...task,
                        id: Date.now() + Math.random(),
                        status: 'pending',
                        progress: 0,
                        deadline: today,
                        lastRecurDate: today
                    };
                    tasksData.push(newTask);
                    task.lastRecurDate = today;
                    updated = true;
                }
            });

            if (updated) saveToStorage();
        }

        // Kiá»ƒm tra quÃ¡ háº¡n
        function checkOverdueTasks() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            let updated = false;
            tasksData.forEach(task => {
                if (task.status !== 'completed') {
                    const deadline = new Date(task.deadline);
                    deadline.setHours(0, 0, 0, 0);
                    
                    if (deadline < today) {
                        task.status = 'overdue';
                        updated = true;
                    }
                }
            });
            
            if (updated) saveToStorage();
        }

        // Cáº­p nháº­t thá»‘ng kÃª
        function updateStats() {
            checkRecurringTasks();
            checkOverdueTasks();
            
            const completed = tasksData.filter(t => t.status === 'completed').length;
            const inProgress = tasksData.filter(t => t.status === 'inprogress').length;
            const pending = tasksData.filter(t => t.status === 'pending').length;
            const overdue = tasksData.filter(t => t.status === 'overdue').length;

            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('inProgressTasks').textContent = inProgress;
            document.getElementById('pendingTasks').textContent = pending;
            document.getElementById('overdueTasks').textContent = overdue;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('vi-VN');
        }

        // Chuyá»ƒn view
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('groupSelectContainer').style.display = 'none';
            document.getElementById('personSelectContainer').style.display = 'none';
            
            if (view === 'all') {
                renderTasks(tasksData);
            } else if (view === 'group') {
                document.getElementById('groupSelectContainer').style.display = 'block';
                renderGroupSelect();
            } else if (view === 'people') {
                document.getElementById('personSelectContainer').style.display = 'block';
                renderPersonSelect();
            }
        }

        // Render group select
        function renderGroupSelect() {
            const groups = [...new Set(tasksData.map(t => t.group))].sort();
            const select = document.getElementById('groupSelect');
            
            select.innerHTML = groups.map((group, index) => {
                const count = tasksData.filter(t => t.group === group).length;
                const isSelected = (currentGroup === group) || (currentGroup === null && index === 0);
                return `<option value="${group}" ${isSelected ? 'selected' : ''}>${group} (${count} cÃ´ng viá»‡c)</option>`;
            }).join('');
            
            if (currentGroup === null && groups.length > 0) {
                currentGroup = groups[0];
            }
            
            switchGroup(currentGroup);
        }

        // Chuyá»ƒn nhÃ³m
        function switchGroup(group) {
            currentGroup = group;
            const filtered = tasksData.filter(t => t.group === group);
            renderTasks(filtered);
        }

        // Render person select
        function renderPersonSelect() {
            const people = [...new Set(tasksData.map(t => t.assignee))].sort();
            const select = document.getElementById('personSelect');
            
            select.innerHTML = people.map((person, index) => {
                const count = tasksData.filter(t => t.assignee === person).length;
                const isSelected = (currentPerson === person) || (currentPerson === null && index === 0);
                const initial = person.charAt(0).toUpperCase();
                return `<option value="${person}" ${isSelected ? 'selected' : ''}>${initial} ${person} (${count} cÃ´ng viá»‡c)</option>`;
            }).join('');
            
            if (currentPerson === null && people.length > 0) {
                currentPerson = people[0];
            }
            
            switchPerson(currentPerson);
        }

        // Chuyá»ƒn ngÆ°á»i
        function switchPerson(person) {
            currentPerson = person;
            const filtered = tasksData.filter(t => t.assignee === person);
            renderTasks(filtered);
        }

        // Hiá»ƒn thá»‹ tasks
        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            
            if (tasks.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:white;font-size:18px;">KhÃ´ng cÃ³ cÃ´ng viá»‡c nÃ o</div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-card ${task.status}">
                    <div class="task-actions">
                        <button class="task-action-btn edit" onclick="editTask(${task.id})">âœï¸ Sá»­a</button>
                        <button class="task-action-btn delete" onclick="deleteTask(${task.id})">ðŸ—‘ï¸ XÃ³a</button>
                    </div>
                    <span class="task-status-badge ${task.status}" onclick="changeStatus(${task.id})" title="Click Ä‘á»ƒ Ä‘á»•i tráº¡ng thÃ¡i">
                        ${getStatusText(task.status)}
                    </span>
                    <div class="task-group">ðŸ“ ${task.group} Â» ${task.program}</div>
                    <div class="task-header">
                        <div class="task-title">${task.title}</div>
                    </div>
                    <div class="task-info">${task.description || ''}</div>
                    <div class="task-meta">
                        <div class="meta-item">ðŸ“… Deadline: ${formatDate(task.deadline)}</div>
                        <div class="meta-item">ðŸ”„ Táº§n suáº¥t: ${task.frequency}</div>
                        <div class="meta-item">ðŸ‘¤ Thá»±c hiá»‡n: ${task.assignee}</div>
                        <div class="meta-item">ðŸ“‹ Äiá»u phá»‘i: ${task.coordinator}</div>
                        <div class="meta-item">âœ… Duyá»‡t: ${task.approver}</div>
                        <div class="meta-item">ðŸ“Š Tiáº¿n Ä‘á»™: ${task.progress}%</div>
                    </div>
                    <div style="margin-top:10px;padding:10px;background:#f0f9ff;border-radius:8px;">
                        <strong style="color:#0369a1;">ðŸ“¦ Äáº§u ra:</strong> ${task.requiredOutput}
                    </div>
                    ${task.status !== 'completed' && task.status !== 'pending' ? `
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${task.progress}%"></div>
                    </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Má»Ÿ modal thÃªm
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'ThÃªm cÃ´ng viá»‡c má»›i';
            document.getElementById('taskForm').reset();
            document.getElementById('taskModal').classList.add('active');
        }

        // Sá»­a task
        function editTask(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Sá»­a cÃ´ng viá»‡c';
            const form = document.getElementById('taskForm');
            
            form.group.value = task.group;
            form.program.value = task.program;
            form.title.value = task.title;
            form.description.value = task.description || '';
            form.coordinator.value = task.coordinator;
            form.assignee.value = task.assignee;
            form.approver.value = task.approver;
            form.deadline.value = task.deadline;
            form.frequency.value = task.frequency;
            form.requiredOutput.value = task.requiredOutput;
            form.status.value = task.status;
            form.progress.value = task.progress;
            form.id.value = id;
            
            document.getElementById('taskModal').classList.add('active');
        }

        // XÃ³a task
        function deleteTask(id) {
            if (confirm('Báº¡n cÃ³ cháº¯c muá»‘n xÃ³a cÃ´ng viá»‡c nÃ y?')) {
                tasksData = tasksData.filter(t => t.id !== id);
                saveToStorage();
                updateStats();
                switchView(currentView);
            }
        }

        // LÆ°u task
        function saveTask(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            const task = {
                id: editingId || Date.now(),
                group: formData.get('group'),
                program: formData.get('program'),
                title: formData.get('title'),
                description: formData.get('description'),
                coordinator: formData.get('coordinator'),
                assignee: formData.get('assignee'),
                approver: formData.get('approver'),
                deadline: formData.get('deadline'),
                frequency: formData.get('frequency'),
                requiredOutput: formData.get('requiredOutput'),
                status: formData.get('status'),
                progress: parseInt(formData.get('progress')),
                lastRecurDate: formData.get('frequency') === 'HÃ ng ngÃ y' ? new Date().toISOString().split('T')[0] : null
            };

            if (editingId) {
                const index = tasksData.findIndex(t => t.id === editingId);
                tasksData[index] = task;
            } else {
                tasksData.push(task);
            }

            saveToStorage();
            closeModal();
            updateStats();
            switchView(currentView);
        }

        // Äá»•i tráº¡ng thÃ¡i
        function changeStatus(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;
            
            if (task.status === 'pending') {
                task.status = 'inprogress';
                task.progress = 50;
            } else if (task.status === 'inprogress') {
                task.status = 'completed';
                task.progress = 100;
            } else if (task.status === 'completed') {
                task.status = 'pending';
                task.progress = 0;
            } else if (task.status === 'overdue') {
                task.status = 'inprogress';
                task.progress = 50;
            }
            
            saveToStorage();
            updateStats();
            switchView(currentView);
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        function getStatusText(status) {
            const statusMap = {
                'completed': 'HoÃ n thÃ nh',
                'inprogress': 'Äang thá»±c hiá»‡n',
                'pending': 'ChÆ°a báº¯t Ä‘áº§u',
                'overdue': 'QuÃ¡ háº¡n'
            };
            return statusMap[status] || status;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN');
        }

        // Export
        function exportData() {
            const dataStr = JSON.stringify(tasksData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marketing-tasks-v2-' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
        }

        // Import JSON
        function importJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (confirm('Nháº­p dá»¯ liá»‡u sáº½ ghi Ä‘Ã¨ dá»¯ liá»‡u hiá»‡n táº¡i. Tiáº¿p tá»¥c?')) {
                            tasksData = data;
                            saveToStorage();
                            updateStats();
                            switchView('all');
                            alert('Nháº­p dá»¯ liá»‡u thÃ nh cÃ´ng!');
                        }
                    } catch (err) {
                        alert('File khÃ´ng Ä‘Ãºng Ä‘á»‹nh dáº¡ng!');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Import Excel
        function importExcel() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet);
                        
                        if (rows.length === 0) {
                            alert('File Excel khÃ´ng cÃ³ dá»¯ liá»‡u!');
                            return;
                        }
                        
                        const convertedData = rows.map((row, index) => {
                            let status = 'pending';
                            let progress = 0;
                            
                            const statusText = (row['Tráº¡ng thÃ¡i'] || row['Status'] || '').toString().toLowerCase();
                            if (statusText.includes('hoÃ n thÃ nh') || statusText.includes('completed')) {
                                status = 'completed';
                                progress = 100;
                            } else if (statusText.includes('Ä‘ang') || statusText.includes('progress')) {
                                status = 'inprogress';
                                progress = parseInt(row['Tiáº¿n Ä‘á»™ %'] || 50);
                            }
                            
                            let deadline = '';
                            const deadlineValue = row['Deadline'] || row['NgÃ y deadline'] || '';
                            if (deadlineValue) {
                                if (typeof deadlineValue === 'number') {
                                    const date = XLSX.SSF.parse_date_code(deadlineValue);
                                    deadline = `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
                                } else {
                                    deadline = deadlineValue.toString().split('T')[0];
                                }
                            }
                            
                            return {
                                id: Date.now() + index,
                                group: row['NhÃ³m viá»‡c'] || row['Group'] || 'ChÆ°a phÃ¢n nhÃ³m',
                                program: row['ChÆ°Æ¡ng trÃ¬nh'] || row['Program'] || '',
                                title: row['CÃ´ng viá»‡c cá»¥ thá»ƒ'] || row['Task'] || 'CÃ´ng viá»‡c ' + (index + 1),
                                description: row['MÃ´ táº£'] || row['Description'] || '',
                                coordinator: row['NgÆ°á»i Ä‘iá»u phá»‘i'] || row['Coordinator'] || '',
                                assignee: row['NgÆ°á»i thá»±c hiá»‡n'] || row['Assignee'] || 'ChÆ°a phÃ¢n cÃ´ng',
                                approver: row['NgÆ°á»i duyá»‡t'] || row['Approver'] || '',
                                deadline: deadline || new Date().toISOString().split('T')[0],
                                frequency: row['Táº§n suáº¥t'] || row['Frequency'] || 'Má»™t láº§n',
                                requiredOutput: row['Äáº§u ra báº¯t buá»™c'] || row['Required Output'] || '',
                                status: status,
                                progress: progress,
                                lastRecurDate: null
                            };
                        });
                        
                        if (confirm(`TÃ¬m tháº¥y ${convertedData.length} cÃ´ng viá»‡c. Nháº­p dá»¯ liá»‡u sáº½ ghi Ä‘Ã¨ dá»¯ liá»‡u hiá»‡n táº¡i. Tiáº¿p tá»¥c?`)) {
                            tasksData = convertedData;
                            saveToStorage();
                            updateStats();
                            switchView('all');
                            alert('Nháº­p Excel thÃ nh cÃ´ng!');
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Lá»—i khi Ä‘á»c file Excel: ' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        }

        // ÄÃ³ng modal khi click ngoÃ i
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target.id === 'taskModal') closeModal();
        });

        // Khá»Ÿi táº¡o
        loadData();
        updateStats();
        renderTasks(tasksData);
    </script>
