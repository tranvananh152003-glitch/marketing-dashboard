<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tiến Độ Marketing 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .last-update {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card.completed .stat-value {
            color: #10b981;
        }

        .stat-card.progress .stat-value {
            color: #f59e0b;
        }

        .stat-card.pending .stat-value {
            color: #6b7280;
        }

        .stat-card.total .stat-value {
            color: #3b82f6;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            transform: scale(1.05);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .tasks-container {
            display: grid;
            gap: 15px;
        }

        .task-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #ddd;
            transition: all 0.3s;
            position: relative;
        }

        .task-card:hover {
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        .task-card.completed {
            border-left-color: #10b981;
            opacity: 0.9;
        }

        .task-card.inprogress {
            border-left-color: #f59e0b;
        }

        .task-card.pending {
            border-left-color: #6b7280;
        }

        .task-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .task-action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .task-action-btn.edit {
            background: #3b82f6;
            color: white;
        }

        .task-action-btn.delete {
            background: #ef4444;
            color: white;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
            padding-right: 120px;
        }

        .task-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .task-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .task-status.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .task-status.inprogress {
            background: #fef3c7;
            color: #92400e;
        }

        .task-status.pending {
            background: #f3f4f6;
            color: #374151;
        }

        .task-info {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .task-meta span {
            font-size: 13px;
            color: #888;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            header h1 {
                font-size: 22px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .stat-card {
                padding: 20px;
            }
            
            .stat-icon {
                font-size: 28px;
            }
            
            .stat-value {
                font-size: 24px;
            }
            
            .task-title {
                font-size: 16px;
            }

            .task-header {
                padding-right: 0;
            }

            .task-actions {
                position: relative;
                top: auto;
                right: auto;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Bảng Theo Dõi Tiến Độ Marketing 2026</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="openAddModal()">➕ Thêm công việc</button>
                <button class="btn btn-primary" onclick="exportData()">💾 Xuất dữ liệu</button>
                <button class="btn btn-danger" onclick="importJSON()">📥 Nhập JSON</button>
                <button class="btn btn-primary" onclick="importExcel()">📊 Nhập Excel</button>
            </div>
            <div class="last-update">Cập nhật: <span id="lastUpdate"></span></div>
        </header>

        <div class="stats-grid">
            <div class="stat-card completed">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Hoàn thành</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="inProgressTasks">0</div>
                <div class="stat-label">Đang thực hiện</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="pendingTasks">0</div>
                <div class="stat-label">Chưa bắt đầu</div>
            </div>
            <div class="stat-card total">
                <div class="stat-icon">📈</div>
                <div class="stat-value" id="progressPercent">0%</div>
                <div class="stat-label">Tiến độ</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Tất cả</button>
            <button class="filter-btn" data-filter="completed">Hoàn thành</button>
            <button class="filter-btn" data-filter="inprogress">Đang làm</button>
            <button class="filter-btn" data-filter="pending">Chưa bắt đầu</button>
        </div>

        <div class="tasks-container" id="tasksContainer"></div>
    </div>

    <!-- Modal thêm/sửa -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Thêm công việc mới</div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <div class="form-group">
                    <label>Tên công việc *</label>
                    <input type="text" name="title" required>
                </div>
                <div class="form-group">
                    <label>Mô tả</label>
                    <textarea name="description"></textarea>
                </div>
                <div class="form-group">
                    <label>Người phụ trách *</label>
                    <input type="text" name="assignee" required>
                </div>
                <div class="form-group">
                    <label>Deadline *</label>
                    <input type="date" name="deadline" required>
                </div>
                <div class="form-group">
                    <label>Trạng thái *</label>
                    <select name="status" required>
                        <option value="pending">Chưa bắt đầu</option>
                        <option value="inprogress">Đang thực hiện</option>
                        <option value="completed">Hoàn thành</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tiến độ (%) *</label>
                    <input type="number" name="progress" min="0" max="100" value="0" required>
                </div>
                <input type="hidden" name="id">
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()" style="background: #6b7280; color: white;">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tasksData = [];
        let currentFilter = 'all';
        let editingId = null;

        // Dữ liệu mẫu ban đầu
        const defaultData = [
            {
                id: Date.now() + 1,
                title: "Lập kế hoạch chiến dịch Q1 2026",
                status: "completed",
                description: "Hoàn thành kế hoạch marketing chi tiết cho quý 1/2026",
                deadline: "2026-01-15",
                assignee: "Nguyễn Văn A",
                progress: 100
            },
            {
                id: Date.now() + 2,
                title: "Thiết kế banner quảng cáo",
                status: "inprogress",
                description: "Thiết kế 10 mẫu banner cho Facebook Ads",
                deadline: "2026-01-20",
                assignee: "Trần Thị B",
                progress: 60
            }
        ];

        // Load dữ liệu từ LocalStorage
        function loadData() {
            const saved = localStorage.getItem('marketingTasks');
            if (saved) {
                tasksData = JSON.parse(saved);
            } else {
                tasksData = defaultData;
                saveToStorage();
            }
        }

        // Lưu vào LocalStorage
        function saveToStorage() {
            localStorage.setItem('marketingTasks', JSON.stringify(tasksData));
        }

        // Cập nhật thống kê
        function updateStats() {
            const completed = tasksData.filter(t => t.status === 'completed').length;
            const inProgress = tasksData.filter(t => t.status === 'inprogress').length;
            const pending = tasksData.filter(t => t.status === 'pending').length;
            const total = tasksData.length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('inProgressTasks').textContent = inProgress;
            document.getElementById('pendingTasks').textContent = pending;
            document.getElementById('progressPercent').textContent = percent + '%';
            
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleString('vi-VN');
        }

        // Hiển thị danh sách công việc
        function renderTasks(filter = 'all') {
            const container = document.getElementById('tasksContainer');
            let filteredTasks = tasksData;

            if (filter !== 'all') {
                filteredTasks = tasksData.filter(task => task.status === filter);
            }

            if (filteredTasks.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:white; font-size:18px;">Không có công việc nào</div>';
                return;
            }

            container.innerHTML = filteredTasks.map(task => `
                <div class="task-card ${task.status}">
                    <div class="task-actions">
                        <button class="task-action-btn edit" onclick="editTask(${task.id})">✏️ Sửa</button>
                        <button class="task-action-btn delete" onclick="deleteTask(${task.id})">🗑️ Xóa</button>
                    </div>
                    <div class="task-header">
                        <div class="task-title">${task.title}</div>
                        <span class="task-status ${task.status}" onclick="changeStatus(${task.id})" style="cursor:pointer;" title="Click để đổi trạng thái">
                            ${getStatusText(task.status)}
                        </span>
                    </div>
                    <div class="task-info">${task.description || ''}</div>
                    <div class="task-meta">
                        <span>📅 ${formatDate(task.deadline)}</span>
                        <span>👤 ${task.assignee}</span>
                        <span>📊 ${task.progress}%</span>
                    </div>
                    ${task.status !== 'completed' && task.status !== 'pending' ? `
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${task.progress}%"></div>
                    </div>
                    ` : ''}
                    <div class="status-quick-change" style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap;">
                        ${task.status !== 'pending' ? '' : '<button class="status-btn" onclick="quickChangeStatus(' + task.id + ', \'inprogress\', 50)" style="background:#fef3c7;color:#92400e;padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;">▶️ Bắt đầu</button>'}
                        ${task.status !== 'inprogress' ? '' : '<button class="status-btn" onclick="quickChangeStatus(' + task.id + ', \'completed\', 100)" style="background:#d1fae5;color:#065f46;padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;">✅ Hoàn thành</button>'}
                        ${task.status === 'completed' ? '<button class="status-btn" onclick="quickChangeStatus(' + task.id + ', \'inprogress\', 50)" style="background:#fef3c7;color:#92400e;padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;">↩️ Làm lại</button>' : ''}
                    </div>
                </div>
            `).join('');
        }

        // Chuyển đổi trạng thái nhanh
        function quickChangeStatus(id, newStatus, newProgress) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;
            
            task.status = newStatus;
            task.progress = newProgress;
            
            saveToStorage();
            updateStats();
            renderTasks(currentFilter);
        }

        // Chuyển đổi trạng thái theo vòng lặp (click vào badge)
        function changeStatus(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;
            
            // Vòng lặp: pending → inprogress → completed → pending
            if (task.status === 'pending') {
                task.status = 'inprogress';
                task.progress = 50;
            } else if (task.status === 'inprogress') {
                task.status = 'completed';
                task.progress = 100;
            } else {
                task.status = 'pending';
                task.progress = 0;
            }
            
            saveToStorage();
            updateStats();
            renderTasks(currentFilter);
        }

        // Mở modal thêm
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Thêm công việc mới';
            document.getElementById('taskForm').reset();
            document.getElementById('taskModal').classList.add('active');
        }

        // Sửa công việc
        function editTask(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Sửa công việc';
            const form = document.getElementById('taskForm');
            form.title.value = task.title;
            form.description.value = task.description || '';
            form.assignee.value = task.assignee;
            form.deadline.value = task.deadline;
            form.status.value = task.status;
            form.progress.value = task.progress;
            form.id.value = id;
            
            document.getElementById('taskModal').classList.add('active');
        }

        // Xóa công việc
        function deleteTask(id) {
            if (confirm('Bạn có chắc muốn xóa công việc này?')) {
                tasksData = tasksData.filter(t => t.id !== id);
                saveToStorage();
                updateStats();
                renderTasks(currentFilter);
            }
        }

        // Lưu công việc
        function saveTask(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            const task = {
                id: editingId || Date.now(),
                title: formData.get('title'),
                description: formData.get('description'),
                assignee: formData.get('assignee'),
                deadline: formData.get('deadline'),
                status: formData.get('status'),
                progress: parseInt(formData.get('progress'))
            };

            if (editingId) {
                const index = tasksData.findIndex(t => t.id === editingId);
                tasksData[index] = task;
            } else {
                tasksData.push(task);
            }

            saveToStorage();
            closeModal();
            updateStats();
            renderTasks(currentFilter);
        }

        // Đóng modal
        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        // Xuất dữ liệu
        function exportData() {
            const dataStr = JSON.stringify(tasksData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marketing-tasks-' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
        }

        // Nhập dữ liệu JSON
        function importJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (confirm('Nhập dữ liệu sẽ ghi đè dữ liệu hiện tại. Tiếp tục?')) {
                            tasksData = data;
                            saveToStorage();
                            updateStats();
                            renderTasks(currentFilter);
                            alert('Nhập dữ liệu thành công!');
                        }
                    } catch (err) {
                        alert('File không đúng định dạng!');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Nhập dữ liệu từ Excel
        function importExcel() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        // Đọc sheet đầu tiên
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet);
                        
                        if (rows.length === 0) {
                            alert('File Excel không có dữ liệu!');
                            return;
                        }
                        
                        // Chuyển đổi dữ liệu Excel sang format của app
                        const convertedData = rows.map((row, index) => {
                            // Xác định trạng thái
                            let status = 'pending';
                            let progress = 0;
                            
                            const statusText = (row['Trạng thái'] || row['Status'] || '').toString().toLowerCase();
                            if (statusText.includes('hoàn thành') || statusText.includes('completed') || statusText.includes('done')) {
                                status = 'completed';
                                progress = 100;
                            } else if (statusText.includes('đang') || statusText.includes('progress') || statusText.includes('doing')) {
                                status = 'inprogress';
                                progress = parseInt(row['Tiến độ %'] || row['Progress'] || 50);
                            }
                            
                            // Xử lý deadline
                            let deadline = '';
                            const deadlineValue = row['Deadline'] || row['Ngày deadline'] || row['Hạn chót'] || '';
                            if (deadlineValue) {
                                if (typeof deadlineValue === 'number') {
                                    // Excel date serial number
                                    const date = XLSX.SSF.parse_date_code(deadlineValue);
                                    deadline = `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
                                } else {
                                    deadline = deadlineValue.toString().split('T')[0];
                                }
                            }
                            
                            return {
                                id: Date.now() + index,
                                title: row['Tên công việc'] || row['Công việc'] || row['Task'] || row['Title'] || 'Công việc ' + (index + 1),
                                description: row['Mô tả'] || row['Description'] || row['Ghi chú'] || '',
                                assignee: row['Người phụ trách'] || row['Assignee'] || row['Owner'] || 'Chưa phân công',
                                deadline: deadline || new Date().toISOString().split('T')[0],
                                status: status,
                                progress: progress
                            };
                        });
                        
                        if (confirm(`Tìm thấy ${convertedData.length} công việc trong Excel.\nNhập dữ liệu sẽ ghi đè dữ liệu hiện tại. Tiếp tục?`)) {
                            tasksData = convertedData;
                            saveToStorage();
                            updateStats();
                            renderTasks(currentFilter);
                            alert('Nhập dữ liệu Excel thành công!');
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Lỗi khi đọc file Excel: ' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        }

        function getStatusText(status) {
            const statusMap = {
                'completed': 'Hoàn thành',
                'inprogress': 'Đang thực hiện',
                'pending': 'Chưa bắt đầu'
            };
            return statusMap[status] || status;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Xử lý bộ lọc
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderTasks(currentFilter);
            });
        });

        // Đóng modal khi click ngoài
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target.id === 'taskModal') {
                closeModal();
            }
        });

        // Khởi tạo
        loadData();
        updateStats();
        renderTasks();
    </script>
</body>
</html>
